[package]
name = "chords_converter"
version = "0.11.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["rustls-tls", "gzip", "cookies"] }
scraper = "0.19"
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
deunicode = "1.4"
heck = "0.5"
hyphenation = { version = "0.8.4", features = ["embed_all"] }
